AWSTemplateFormatVersion: '2010-09-09'
Description: MCFPipe Tester - ECS Fargate task in public subnet

Parameters:
  TesterImageUri:
    Type: String
    Description: ECR image URI (e.g. 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/tester:latest)
  LogGroupName:
    Type: String
    Default: /mcfpipe/tester
  Cpu:
    Type: Number
    Default: 256
  Memory:
    Type: Number
    Default: 512
  S3Bucket:
    Type: String
    Default: mcfpipe
  TestsS3Prefix:
    Type: String
    Default: apps/tests

Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: 14

  TesterExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TesterTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  TesterTaskRoleS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: tester-s3-read-tests
      Roles: [ !Ref TesterTaskRole ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # allow listing only inside your tests prefix
          - Sid: ListTestsPrefix
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:aws:s3:::${S3Bucket}
            Condition:
              StringLike:
                s3:prefix:
                  - !Ref TestsS3Prefix
                  - !Sub '${TestsS3Prefix}*'
          # allow reading any object within the tests prefix
          - Sid: GetObjectsInPrefix
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub arn:aws:s3:::${S3Bucket}/${TestsS3Prefix}*

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: mcfpipe-tester

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: mcfpipe-tester
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TesterExecutionRole.Arn
      TaskRoleArn: !GetAtt TesterTaskRole.Arn
      ContainerDefinitions:
        - Name: tester
          Image: !Ref TesterImageUri
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

Outputs:
  TesterClusterName:
    Value: !Ref Cluster
  TesterTaskDefinitionArn:
    Value: !Ref TaskDefinition
  TesterLogGroup:
    Value: !Ref Logs
