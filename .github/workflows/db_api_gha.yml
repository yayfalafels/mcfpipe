name: Database API

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/db_api_gha.yml'
      - '.github/scripts/diff_detect.sh'
      - 'aws/cloudformation/db_api_stack.yaml'
      - 'aws/cloudformation/cfn_stack_diagnostics.sh'
      - 'aws/cloudformation/export_stack_outputs.sh'
      - 'jobdb/**'
#trigger
jobs:
  dbapi-deploy:
    name: DB API Deploy
    runs-on: ubuntu-latest

    env:
      CONFIG_PATH: setup/config.env
      STACK_NAME: mcfpipe-dbapi
      DIFF_DETECT_SCRIPT: .github/scripts/diff_detect.sh
      CF_TEMPLATE_DIR: aws/cloudformation
      STACK_TEMPLATE_FILE: db_api_stack.yaml
      NETWORK_CONFIG_JSON: network_config.json
      NETWORK_CONFIG_S3_PATH: aws/network
      DBAPI_APP_DIR: jobdb
      DBAPI_APP: jobdb
      REPO_NAME: mcfpipe-dbapi
      CF_DB_API_ID_KEY: RestApiId
      STACK_OUTPUT_S3_PATH: apps/jobdb
      STACK_OUTPUT_JSON: jobdb_stack_config.json
      TESTS_UPLOAD_SCRIPT: tester/tests_upload_to_s3.sh
      TESTER_CLUSTER: mcfpipe-tester
      TESTER_TASK: mcfpipe-tester
      TESTER_CONTAINER: tester
      TESTER_TASK_SCRIPT: tester/tester_task_execute.sh
      TESTER_LOG_GROUP: /mcfpipe/tester
      TESTER_S3_PREFIX: apps/tests/jobdb
      PYTEST_ARGS: -q
      STACK_EXPORT_SCRIPT: aws/cloudformation/export_stack_outputs.sh
      STACK_FAIL_DIAGNOSTICS_SCRIPT: aws/cloudformation/cfn_stack_diagnostics.sh

    steps:
      - name: Init Run Status
        id: initialize_run_status
        run: echo "DBAPI_SUCCESS=true" >> $GITHUB_ENV

      - name: Checkout repository
        id: repo_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        

      - name: Compute diff range
        id: diff_range_set
        run: |
          chmod +x $DIFF_DETECT_SCRIPT
          EVENT_NAME="${{ github.event_name }}" \
          PR_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}" \
          PUSH_BEFORE_SHA="${{ github.event.before }}" \
          GITHUB_SHA_IN="${{ github.sha }}" \
          REF_NAME="${{ github.ref_name }}" \
          $DIFF_DETECT_SCRIPT

      - name: Detect changes affecting app image
        id: app_dir_change
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.diff_range_set.outputs.base }}
          ref:  ${{ steps.diff_range_set.outputs.ref }}
          filters: |
            {
              "app": ["${{ env.DBAPI_APP_DIR }}/**"]
            }

      - name: Load environment config
        id: env_var_set
        run: cat $CONFIG_PATH >> $GITHUB_ENV

      - name: Configure AWS credentials
        id: aws_cred
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS config
        id: aws_config
        shell: bash
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV          
          
      - name: Download and parse network config
        id: network_config
        shell: bash
        run: |
            set -euo pipefail
            aws s3 cp "s3://$S3_BUCKET/$NETWORK_CONFIG_S3_PATH/$NETWORK_CONFIG_JSON" $NETWORK_CONFIG_JSON
            JQ='map({(.OutputKey): .OutputValue})|add'

            echo "VPC_ID=$(jq -r "$JQ".VpcId $NETWORK_CONFIG_JSON)" >> "$GITHUB_ENV"
            echo "SGHTTP=$(jq -r "$JQ".SGHTTP $NETWORK_CONFIG_JSON)" >> "$GITHUB_ENV"
            echo "VPCE_ID=$(jq -r "$JQ".VPCExecuteApiId $NETWORK_CONFIG_JSON)" >> "$GITHUB_ENV"
            echo "SG_PRIVATE=$(jq -r "$JQ".SGPrivate $NETWORK_CONFIG_JSON)" >> "$GITHUB_ENV"
            echo "PRIVATE_SUBNET=$(jq -r "$JQ".PrivateSubnetId $NETWORK_CONFIG_JSON)" >> "$GITHUB_ENV"

            PUBLIC_SUB1=$(jq -r "$JQ".PublicSubnet1Id $NETWORK_CONFIG_JSON)
            PUBLIC_SUB2=$(jq -r "$JQ".PublicSubnet2Id $NETWORK_CONFIG_JSON)
            PUBLIC_SUBNETS=\"$PUBLIC_SUB1\",\"$PUBLIC_SUB2\"

            {
              echo "PUBLIC_SUB1=$PUBLIC_SUB1"
              echo "PUBLIC_SUB2=$PUBLIC_SUB2"
              echo "PUBLIC_SUBNETS=$PUBLIC_SUBNETS"
            } >> "$GITHUB_ENV"            

      - name: Install jq
        id: install_jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: ECR Login
        id: ecr_login
        if: steps.app_dir_change.outputs.app == 'true' || inputs.force_rebuild == true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Set image tags and ECR URI
        id: image_tag_name
        env:
          REBUILD: ${{ steps.decide.outputs.rebuild }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_REPO="${REGISTRY}/${REPO_NAME}"

          if [[ "${REBUILD}" == "true" ]]; then
            IMAGE_TAG="sha-${SHORT_SHA}"
            IMAGE_URI="${IMAGE_REPO}:sha-${SHORT_SHA}"            
          else
            # Pull the most recently pushed TAGGED image (any tag)
            # If you only want sha-* tags, add a jq filter: select(.imageTags[]|test("^sha-"))
            IMAGE_TAG="$(aws ecr describe-images \
              --repository-name "${REPO_NAME}" \
              --filter tagStatus=TAGGED \
              --query 'reverse(sort_by(imageDetails,&imagePushedAt))[0].imageTags[0]' \
              --output text)"
            if [[ -z "${IMAGE_TAG}" || "${IMAGE_TAG}" == "None" ]]; then
              echo "No tagged images found in ECR for ${REPO_NAME}" >&2
              exit 1
            fi
            IMAGE_URI="${IMAGE_REPO}:${IMAGE_TAG}"
            DIGEST=$(aws ecr describe-images \
              --repository-name "$REPO_NAME" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' --output text)
            DIGEST_URI="${IMAGE_REPO}@${DIGEST}"
            echo "DIGEST_URI=$DIGEST_URI" >> $GITHUB_ENV
            fi

          echo "IMAGE_URI=${IMAGE_URI}" | tee -a "$GITHUB_OUTPUT"
          {
            echo "IMAGE_REPO=${IMAGE_REPO}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "IMAGE_URI=${IMAGE_URI}"
           } >> "$GITHUB_ENV" 

      - name: Ensure ECR repo exists
        id: ecr_repo_exists
        if: steps.app_dir_change.outputs.app == 'true' || inputs.force_rebuild == true
        run: |
          aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$REPO_NAME" >/dev/null

      - name: Build DB API image
        id: docker_image_build
        if: steps.app_dir_change.outputs.app == 'true' || inputs.force_rebuild == true
        working-directory:  ${{ env.DBAPI_APP_DIR }}
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Push image to ECR
        id: docker_image_ecr
        if: steps.app_dir_change.outputs.app == 'true' || inputs.force_rebuild == true
        run: |
          docker push "$IMAGE_URI"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          DIGEST_URI="${IMAGE_REPO}@${DIGEST}"
          echo "DIGEST_URI=$DIGEST_URI" >> $GITHUB_ENV

      - name: Upload tests to S3
        id: tests_upload_s3
        if: steps.app_dir_change.outputs.app == 'true' || inputs.force_rebuild == true
        run: |
          chmod +x $TESTS_UPLOAD_SCRIPT
          ./$TESTS_UPLOAD_SCRIPT \
            --root $DBAPI_APP_DIR \
            --bucket "${S3_BUCKET}" \
            --prefix-base "$TESTER_S3_PREFIX" \

      - name: Deploy CloudFormation Stack
        id: stack_deploy
        continue-on-error: true
        run: |
          STATE=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)

          if [[ "$ALLOW_STACK_DELETE" == "true" ]] && [[ "$STATE" =~ ^(ROLLBACK_COMPLETE|CREATE_FAILED)$ ]]; then
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          fi

          aws cloudformation deploy \
            --template-file $CF_TEMPLATE_DIR/$STACK_TEMPLATE_FILE \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              VpcId=$VPC_ID \
              PrivateSubnetIds=$PRIVATE_SUBNET \
              DBLambdaSG=$SG_PRIVATE \
              S3Bucket=$S3_BUCKET \
              LambdaImageUri=$DIGEST_URI \
              DBSchemaS3=$STORAGE_S3_DIR/$DB_SCHEMA_JSON \
              StageName=$DEV_ENV \
              GitSha="${GITHUB_SHA::7}" \
              ExecuteApiVpceId=$VPCE_ID \
            --tags \
              role=$ROLE \
              project=$PROJECT_NAME

      - name: CFN failure diagnostics
        id: stack_fail_diagnostics
        if: steps.stack_deploy.outcome == 'failure'
        run: |
          bash $STACK_FAIL_DIAGNOSTICS_SCRIPT "$STACK_NAME" "$AWS_REGION" --nested
          echo "DB API deploy failed"
          exit 1

      - name: Create API Gateway Deployment
        id: api_deploy
        if: steps.stack_deploy.outcome == 'success'
        run: |
          REST_API_ID=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='RestApiId'].OutputValue" \
            --output text)

          STAGE_NAME=$DEV_ENV
          GIT_SHA=${GITHUB_SHA::7}

          echo "Creating deployment for API $REST_API_ID at stage $STAGE_NAME ($GIT_SHA)"

          DEPLOY_ID=$(aws apigateway create-deployment \
            --rest-api-id "$REST_API_ID" \
            --stage-name "$STAGE_NAME" \
            --description "Manual deploy from GHA: $GIT_SHA" \
            --query "id" \
            --output text)

          echo "✅ Created deployment: $DEPLOY_ID"
          
      - name: Export stack outputs to S3
        id: stack_outputs
        if: steps.stack_deploy.outcome == 'success'
        run: |
          chmod +x ./$STACK_EXPORT_SCRIPT
          ./$STACK_EXPORT_SCRIPT "${{ env.STACK_NAME }}" "${{ env.AWS_REGION }}" "${{ env.S3_BUCKET }}" "${{ env.STACK_OUTPUT_S3_PATH }}/${{ env.STACK_OUTPUT_JSON }}"

      - name: Get DB API ID
        id: db_api_id
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs" \
            --output json)
          API_ID=$(echo "$OUTPUTS" | jq -r --arg k "$CF_DB_API_ID_KEY" \
            '.[] | select(.OutputKey==$k) | .OutputValue')
          echo "DB_API_ID=$API_ID" >> $GITHUB_ENV

      - name: Test API execute tester ECS task
        id: api_test
        if: steps.stack_deploy.outcome == 'success'
        run: |
          chmod +x ./$TESTER_TASK_SCRIPT
          CLUSTER=$TESTER_CLUSTER \
          TASK_DEF=$TESTER_TASK \
          CONTAINER_NAME=$TESTER_CONTAINER \
          DB_API_URL=$DB_API_URL \
          SUBNETS_CSV=$PUBLIC_SUBNETS \
          SECURITY_GROUPS_CSV=$SGHTTP \
          S3_BUCKET="$S3_BUCKET" \
          TESTS_S3_DIR="$TESTER_S3_PREFIX" \
          LOGGING_LEVEL="$LOGGING_LEVEL" \
          LOG_GROUP="$TESTER_LOG_GROUP" \
          TAG_ROLE="$ROLE" \
          TAG_PROJECT_NAME="$PROJECT_NAME" \
          ./$TESTER_TASK_SCRIPT          

      - name: Fail workflow if build failed
        id: fail_task
        if: env.DBAPI_SUCCESS == 'false'
        run: |
          echo "DB API deploy failed"
          exit 1
