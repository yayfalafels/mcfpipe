name: Tester

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/tester_gha.yml'
      - '.github/scripts/diff_detect.sh'
      - 'aws/cloudformation/tester_stack.yaml'
      - 'aws/cloudformation/cfn_stack_diagnostics.sh'
      - 'aws/cloudformation/export_stack_outputs.sh'
      - 'tester/**'
# trigger
jobs:
  tester-deploy:
    name: Tester Image Build and Stack Deploy
    runs-on: ubuntu-latest

    env:
      CONFIG_PATH: setup/config.env
      STACK_NAME: mcfpipe-tester
      DIFF_DETECT_SCRIPT: .github/scripts/diff_detect.sh
      CF_TEMPLATE_DIR: aws/cloudformation
      STACK_TEMPLATE_FILE: tester_stack.yaml
      APP_SC_S3_DIR: apps/tester
      TESTS_S3_DIR: apps/tests
      APP_DIR: tester
      APP_NAME: tester
      STACK_OUTPUT_S3_PATH: apps/tester
      STACK_OUTPUT_JSON: tester_stack_config.json
      STACK_EXPORT_SCRIPT: aws/cloudformation/export_stack_outputs.sh
      STACK_FAIL_DIAGNOSTICS_SCRIPT: aws/cloudformation/cfn_stack_diagnostics.sh
      REPO_NAME: mcfpipe-tester

    steps:
      - name: Init Run Status
        id: initialize_run_status
        run: echo "TASK_SUCCESS=true" >> $GITHUB_ENV

      - name: Checkout repository
        id: repo_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        

      - name: Compute diff range
        id: diff_range_set
        run: |
          chmod +x $DIFF_DETECT_SCRIPT
          EVENT_NAME="${{ github.event_name }}" \
          PR_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}" \
          PUSH_BEFORE_SHA="${{ github.event.before }}" \
          GITHUB_SHA_IN="${{ github.sha }}" \
          REF_NAME="${{ github.ref_name }}" \
          $DIFF_DETECT_SCRIPT

      - name: Detect changes affecting tester image
        id: tester_dir_change
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.diff_range_set.outputs.base }}
          ref:  ${{ steps.diff_range_set.outputs.ref }}
          filters: |
            {
              "tester": ["${{ env.APP_DIR }}/**"]
            }

      - name: Load environment config
        id: env_var_set
        run: cat $CONFIG_PATH >> $GITHUB_ENV

      - name: Configure AWS credentials
        id: aws_cred
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS config
        id: aws_config
        shell: bash
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
          
      - name: Login to ECR
        id: ecr_login
        if: steps.tester_dir_change.outputs.tester == 'true' || inputs.force_rebuild == true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Set image tags and ECR URI
        id: image_tag_name
        env:
          REBUILD: ${{ steps.decide.outputs.rebuild }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_REPO="${REGISTRY}/${REPO_NAME}"

          if [[ "${REBUILD}" == "true" ]]; then
            IMAGE_TAG="sha-${SHORT_SHA}"
            IMAGE_URI="${IMAGE_REPO}:sha-${SHORT_SHA}"
          else
            # Pull the most recently pushed TAGGED image (any tag)
            # If you only want sha-* tags, add a jq filter: select(.imageTags[]|test("^sha-"))
            IMAGE_TAG="$(aws ecr describe-images \
              --repository-name "${REPO_NAME}" \
              --filter tagStatus=TAGGED \
              --query 'reverse(sort_by(imageDetails,&imagePushedAt))[0].imageTags[0]' \
              --output text)"
            if [[ -z "${IMAGE_TAG}" || "${IMAGE_TAG}" == "None" ]]; then
              echo "No tagged images found in ECR for ${REPO_NAME}" >&2
              exit 1
            fi
            IMAGE_URI="${IMAGE_REPO}:${IMAGE_TAG}"
          fi

          echo "IMAGE_URI=${IMAGE_URI}" | tee -a "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV" 
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV" 

      - name: Ensure ECR repo exists
        id: ecr_repo_exists
        if: steps.tester_dir_change.outputs.tester == 'true' || inputs.force_rebuild == true
        run: |
          aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$REPO_NAME" >/dev/null

      - name: Build tester image
        id: docker_image_build
        if: steps.tester_dir_change.outputs.tester == 'true' || inputs.force_rebuild == true
        working-directory:  ${{ env.APP_DIR }}
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Push image to ECR
        id: docker_image_ecr
        if: steps.tester_dir_change.outputs.tester == 'true' || inputs.force_rebuild == true
        run: |
          docker push "$IMAGE_URI"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV

      - name: Deploy CloudFormation Stack
        id: stack_deploy
        continue-on-error: true
        run: |
          STATE=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)

          if [[ "$ALLOW_STACK_DELETE" == "true" ]] && [[ "$STATE" =~ ^(ROLLBACK_COMPLETE|CREATE_FAILED)$ ]]; then
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          fi

          aws cloudformation deploy \
            --template-file $CF_TEMPLATE_DIR/$STACK_TEMPLATE_FILE \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              TesterImageUri=$IMAGE_URI \
              LogGroupName=/$PROJECT_NAME/$APP_NAME \
              S3Bucket=$S3_BUCKET \
              TestS3Prefix=$TESTS_S3_DIR \
            --tags \
              role=$ROLE \
              project=$PROJECT_NAME

      - name: CFN failure diagnostics
        id: stack_fail_diagnostics
        if: steps.stack_deploy.outcome == 'failure'
        run: |
          bash $STACK_FAIL_DIAGNOSTICS_SCRIPT "$STACK_NAME" "$AWS_REGION" --nested
          echo "stack deploy failed"
          exit 1

      - name: Export stack outputs to S3
        id: stack_outputs
        run: |
          chmod +x ./$STACK_EXPORT_SCRIPT
          ./$STACK_EXPORT_SCRIPT "${{ env.STACK_NAME }}" "${{ env.AWS_REGION }}" "${{ env.S3_BUCKET }}" "${{ env.STACK_OUTPUT_S3_PATH }}/${{ env.STACK_OUTPUT_JSON }}"

      - name: Fail workflow if build failed
        if: env.TASK_SUCCESS == 'false'
        run: |
          echo "DB API deploy failed"
          exit 1
